name: MoonlitMac
options:
  bundleIdPrefix: com.moonlit
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: "Moonlit"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright \u00A9 2026 Moonlit"

packages:
  MoonlitCore:
    path: ../../Packages/MoonlitCore
  MPVKit:
    path: ../../Vendor/MPVKit
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: "4.6.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.4"

targets:
  MoonlitMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
    dependencies:
      - package: MoonlitCore
      - package: MPVKit
      - package: Lottie
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "app.trymoonlit"
        DEVELOPMENT_TEAM: 5TWS8P597N
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MoonlitMac.entitlements
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.entertainment"
        # Sparkle's Ed25519 public key, from `generate_keys` (see
        # Sources/Services/UpdaterService.swift and docs/updates.md). The
        # matching private key lives in this machine's keychain — `sign_update`
        # needs to run from here (or wherever the key was exported to) when
        # cutting a release.
        INFOPLIST_KEY_SUPublicEDKey: "AjlmmWtXAhJTZDqHfQjp3vNqTo0W40ZmI5liHwJfi7s="
      configs:
        # Release-only: Hardened Runtime, required for `notarytool` to accept
        # the archive. Signing identity stays Automatic even here — rather
        # than forcing "Developer ID Application" at the project level
        # (which needs a matching provisioning profile picked manually,
        # since this target's Sign In with Apple entitlement means it isn't
        # profile-free), `Scripts/release.sh` re-signs with Developer ID at
        # the `-exportArchive` step via docs/ExportOptions-DeveloperID.plist.
        # Xcode manages the Developer ID profile automatically there.
        # See docs/updates.md for the full archive → notarize → staple flow.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Normalize Embedded Frameworks
        script: Scripts/normalize-embedded-frameworks.sh
        outputFiles:
          - "$(DERIVED_FILE_DIR)/NormalizeEmbeddedFrameworks.stamp"

  MoonlitMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MoonlitMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "app.trymoonlit.tests"
