<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1">
<title>Neon Halo Render</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  canvas {
    border-radius: 12px;
    max-width: 100vw;
    max-height: 100vh;
  }
  .info {
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">
  <canvas id="c" width="800" height="600"></canvas>
  <span class="info">Neon Contour Halo — 7.72s cycle · 21 rings · continuous evolution</span>
</div>

<script>
;(function () {
  const W = 800, H = 600;
  const NUM_RINGS = 21;
  const SAMPLES = 256;

  // ── Main & offscreen canvases ──
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");

  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const offCtx = off.getContext("2d");

  // ── Spectrum (matches Swift angular gradient) ──
  const spectrum = [
    [0.05, 0.90, 1.0], [0.14, 0.31, 1.0], [0.51, 0.14, 1.0],
    [1.0, 0.08, 0.59], [1.0, 0.16, 0.24], [1.0, 0.45, 0.05],
    [1.0, 0.08, 0.59], [0.51, 0.14, 1.0], [0.14, 0.31, 1.0],
    [0.05, 0.90, 1.0]
  ];

  function colorAt(t) {
    const i = t * (spectrum.length - 1);
    const i0 = Math.floor(i), i1 = Math.min(i0 + 1, spectrum.length - 1);
    const f = i - i0;
    const a = spectrum[i0], b = spectrum[i1];
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  }

  // ── Motion ──
  function center(t) {
    return [
      399.8 + Math.sin(t*0.813)*24.2 + Math.sin(t*0.371+1.1)*3.3,
      297.9 + Math.cos(t*0.692+0.5)*23.9 + Math.sin(t*0.284)*4.0
    ];
  }
  function expansion(t) {
    return 1.0 + Math.sin(t*0.742-0.4)*0.061 + Math.sin(t*0.289+0.8)*0.026;
  }

  // ── Ring configuration ──
  function ringCfg(i) {
    const n = i/20;
    return {
      r: 144+i*5,
      xs: 1.0+Math.sin(i*0.78)*0.020,
      ys: 0.78+Math.cos(i*0.51)*0.035,
      ga: (-91+i*4.1)*(Math.PI/180),
      op: 0.46+n*0.54,
      lw: 0.86+n*0.20
    };
  }
  const cfgs = Array.from({length:NUM_RINGS}, (_,i)=>ringCfg(i));

  // ── Deformation ──
  function deform(theta, idx, t) {
    const a = Math.sin(theta*3.0 + t*0.82 + idx*0.42);
    const b = Math.sin(theta*5.0 - t*0.51 + idx*0.91);
    const c = Math.cos(theta*7.0 + t*0.31 - idx*0.29);
    const d = Math.sin(theta*2.0 - t*1.14 + idx*0.18);
    return (a*0.43+b*0.26+c*0.19+d*0.12)*(7.5+(idx/20)*16.0);
  }

  // ── Generate ring vertices ──
  function points(cx, cy, exp, cfg, idx, t) {
    const br = cfg.r*exp, xs = cfg.xs, ys = cfg.ys;
    const pts = [];
    for (let s=0; s<=SAMPLES; s++) {
      const th = (s/SAMPLES)*2*Math.PI;
      const d = deform(th, idx, t);
      const rx = (br+d)*xs, ry = (br+d)*ys;
      pts.push([cx+Math.cos(th)*rx, cy+Math.sin(th)*ry, th]);
    }
    return pts;
  }

  // ── Draw one ring pass to offscreen canvas (sharp, angular-gradiented) ──
  function drawPassToOffscreen(cx, cy, exp, t, width, opacity) {
    offCtx.clearRect(0, 0, W, H);

    for (let i=0; i<NUM_RINGS; i++) {
      const cfg = cfgs[i];
      const pts = points(cx, cy, exp, cfg, i, t);
      if (pts.length<2) continue;

      for (let s=0; s<pts.length-1; s++) {
        const [x0,y0,th0] = pts[s], [x1,y1,th1] = pts[s+1];
        const a = ((th0+th1)/2+cfg.ga)%(2*Math.PI);
        const ct = (a<0?a+2*Math.PI:a)/(2*Math.PI);
        const [r,g,b] = colorAt(ct);

        offCtx.beginPath();
        offCtx.moveTo(x0, y0);
        offCtx.lineTo(x1, y1);
        offCtx.strokeStyle = `rgba(${~~(r*255)},${~~(g*255)},${~~(b*255)},${(opacity*cfg.op).toFixed(3)})`;
        offCtx.lineWidth = width*cfg.lw;
        offCtx.lineCap = "round";
        offCtx.lineJoin = "round";
        offCtx.stroke();
      }
    }
  }

  // ── Bloom: magenta→violet→cyan radial ellipse ──
  function drawBloom(cx, cy, exp) {
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 260);
    grad.addColorStop(0,   "rgba(255,20,150,0.164)");
    grad.addColorStop(0.33,"rgba(130,36,255,0.098)");
    grad.addColorStop(0.66,"rgba(13,230,255,0.037)");
    grad.addColorStop(1,   "rgba(0,0,0,0)");

    ctx.save();
    ctx.filter = "blur(58px)";
    ctx.beginPath();
    ctx.ellipse(cx, cy, 280*exp, 220*exp, 0, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }

  // ── Background ──
  function drawBg() {
    const g = ctx.createRadialGradient(W/2, H/2, 30, W/2, H/2, 470);
    g.addColorStop(0, "#130e1d");
    g.addColorStop(1, "#030306");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ── Composite offscreen with blur ──
  function compositePass(blur) {
    if (blur>0) ctx.filter = `blur(${blur}px)`;
    ctx.drawImage(off, 0, 0);
    ctx.filter = "none";
  }

  // ── Frame ──
  const start = performance.now()/1000;

  function tick() {
    const t = (performance.now()/1000 - start);
    const [cx, cy] = center(t);
    const exp = expansion(t);

    ctx.clearRect(0, 0, W, H);
    drawBg();
    drawBloom(cx, cy, exp);

    // Pass 1: thick + heavily blurred
    drawPassToOffscreen(cx, cy, exp, t, 24, 0.23);
    compositePass(23);

    // Pass 2: medium + slightly blurred
    drawPassToOffscreen(cx, cy, exp, t, 7, 0.48);
    compositePass(7);

    // Pass 3: thin, sharp — draw directly to main canvas for crispness
    ctx.filter = "none";
    for (let i=0; i<NUM_RINGS; i++) {
      const cfg = cfgs[i];
      const pts = points(cx, cy, exp, cfg, i, t);
      if (pts.length<2) continue;
      for (let s=0; s<pts.length-1; s++) {
        const [x0,y0,th0]=pts[s], [x1,y1,th1]=pts[s+1];
        const a = ((th0+th1)/2+cfg.ga)%(2*Math.PI);
        const ct = (a<0?a+2*Math.PI:a)/(2*Math.PI);
        const [r,g,b] = colorAt(ct);
        ctx.beginPath();
        ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
        ctx.strokeStyle = `rgba(${~~(r*255)},${~~(g*255)},${~~(b*255)},${(0.97*cfg.op).toFixed(3)})`;
        ctx.lineWidth = 1.25*cfg.lw;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
