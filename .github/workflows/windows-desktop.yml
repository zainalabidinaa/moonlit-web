name: Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - 'Apps/MoonlitWindows/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    paths:
      - 'Apps/MoonlitWindows/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Apps/MoonlitWindows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/MoonlitWindows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Apps/MoonlitWindows/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Fetch desktop sidecars (libmpv + shaders)
        run: npm run setup:desktop

      - name: Add libmpv to PATH for tests
        run: echo "${{ github.workspace }}\Apps\MoonlitWindows\src-tauri\libmpv" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npx vitest run

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npx tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-windows-installer
          path: Apps/MoonlitWindows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
